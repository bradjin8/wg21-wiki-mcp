name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  pypi-publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wg21-wiki-mcp
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "${TAG_NAME}" in
            v*) TAG_VERSION="${TAG_NAME#v}" ;;
            *)
              echo "::error::Expected tag vX.Y.Z, got ${TAG_NAME}"
              exit 1
              ;;
          esac
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          PKG_VERSION=$(python -c "
          import pathlib
          import re
          text = pathlib.Path('src/wg21_wiki_mcp/__init__.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\\s*=\\s*[\"\\']([^\"\\']+)[\"\\']', text, re.M)
          if not match:
              raise SystemExit('__version__ not found in src/wg21_wiki_mcp/__init__.py')
          print(match.group(1))
          ")
          echo "Tag version: ${TAG_VERSION}"
          echo "pyproject.toml version: ${PYPROJECT_VERSION}"
          echo "__init__.py version: ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PYPROJECT_VERSION}" ] || [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag ${TAG_NAME} (${TAG_VERSION}) must match pyproject.toml (${PYPROJECT_VERSION}) and __init__.py (${PKG_VERSION}) before publish"
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
