# Local pre-commit hooks. Install once with `pre-commit install`; run all with
# `pre-commit run --all-files`. CI runs the same lint/format/type checks.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b # v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 22f0422809455ec89ffdcf5a00170ba816e42ddb # v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        # Runs in the project's own environment (where pydantic etc. are
        # installed) so type-checking matches CI. Activate the venv first.
        name: mypy
        entry: mypy
        args: ["src"]
        language: system
        types: [python]
        pass_filenames: false
